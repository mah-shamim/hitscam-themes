<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>অর্ডার ট্র্যাক করুন – HitsCam</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main class="container" style="max-width:760px">
  <div class="breadcrumb-bar"><a href="index.html">Home</a> / অর্ডার ট্র্যাক</div>
  <h1 class="page-title mb-2">অর্ডার ট্র্যাক করুন</h1>
  <p class="text-muted">অর্ডার নম্বর ও ফোন নাম্বার দিয়ে আপনার অর্ডারের বর্তমান অবস্থা জানুন।</p>

  <form class="panel mb-4" id="trackForm" novalidate>
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label">অর্ডার নম্বর *</label><input class="form-control" name="id" placeholder="যেমন: 538" required></div>
      <div class="col-md-6"><label class="form-label">ফোন নাম্বার *</label><input class="form-control" name="phone" type="tel" inputmode="tel" placeholder="01XXXXXXXXX" required></div>
      <div class="col-12"><button class="btn btn-brand btn-lg w-100"><i class="bi bi-search"></i> ট্র্যাক করুন</button></div></div>
  </form>

  <div class="panel mb-5" id="trackResult" style="display:none">
    <h5 class="fw-bold">অর্ডার <span id="tId"></span></h5>
    <p>বর্তমান স্ট্যাটাস: <span class="status-pill" id="tStatus"></span></p>
    <ul class="timeline mt-3" id="tLine"></ul>
  </div>
</main>
<div id="site-footer"></div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
$(function () {
  const steps = [['📝', 'অর্ডার গ্রহণ', 'আপনার অর্ডার আমরা পেয়েছি'], ['📞', 'কনফার্মেশন কল', 'আমরা ফোনে কনফার্ম করব'], ['📦', 'প্যাকেজিং', 'প্রোডাক্ট প্যাক করা হবে'], ['🚚', 'কুরিয়ারে পাঠানো', 'আপনার ঠিকানায় পৌঁছাবে'], ['✅', 'ডেলিভারি সম্পন্ন', 'উপভোগ করুন!']];
  $('#trackForm').on('submit', function (e) {
    e.preventDefault(); const id = $.trim(this.id.value).replace('#', ''), ph = $.trim(this.phone.value);
    if (!id || !ph) { HC.toast('অর্ডার নম্বর ও ফোন দিন'); return; }
    // ডেমো: ডিজাইন প্রিভিউর জন্য স্ট্যাটাস Confirmation call ধরা হয়েছে। WooCommerce এ আসল অর্ডার স্ট্যাটাস বসবে।
    const cur = 1;
    $('#tId').text('#' + id); $('#tStatus').text('Processing');
    $('#tLine').html(steps.map((s, i) => `<li class="${i < cur ? 'done' : i === cur ? 'current' : ''}"><div class="tl-dot">${s[0]}</div><div><h6>${s[1]}</h6><p>${s[2]}</p></div></li>`).join(''));
    $('#trackResult').slideDown();
  });
});
</script>
</body>
</html>
