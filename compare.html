<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f172a'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23e03131'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23fff'/%3E%3C/svg%3E">
<title>পণ্য তুলনা – HitsCam</title>
<meta name="description" content="পণ্য তুলনা – দাম, রেটিং ও ফিচার পাশাপাশি দেখুন।">
<meta name="theme-color" content="#e03131"><meta name="robots" content="noindex,follow">
<meta property="og:site_name" content="HitsCam"><meta property="og:locale" content="bn_BD"><meta property="og:type" content="website">
<meta property="og:title" content="পণ্য তুলনা – HitsCam"><meta property="og:description" content="পণ্য তুলনা – দাম, রেটিং ও ফিচার পাশাপাশি দেখুন।"><meta property="og:image" content="assets/icons/icon-512.png">
<meta name="twitter:card" content="summary"><meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main class="container">
  <div class="breadcrumb-bar"><a href="index.html">Home</a> / পণ্য তুলনা</div>
  <h1 class="page-title mb-3">পণ্য তুলনা</h1>
  <div id="cmpRoot"></div>
</main>
<div id="site-footer"></div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/extras.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/analytics.js"></script>
<script src="assets/js/pro.js"></script>
<script>
$(function () {
  const B = HC.BDT, TYPE = { simple: 'সিম্পল', variable: 'ভ্যারিয়েবল', grouped: 'গ্রুপড', external: 'এক্সটার্নাল' };
  function render() {
    const list = HC.cmp().map(HC.find);
    if (list.length < 1) { $('#cmpRoot').html('<div class="panel text-center text-muted py-5"><i class="bi bi-arrow-left-right fs-1"></i><p class="mt-2 mb-3">তুলনা করার জন্য কোনো পণ্য বাছাই করা হয়নি। যেকোনো প্রোডাক্ট কার্ডের <i class="bi bi-arrow-left-right"></i> বাটনে ক্লিক করুন (সর্বোচ্চ ৩টি)।</p><a href="shop.html" class="btn btn-brand rounded-pill">শপে যান</a></div>'); return; }
    const price = p => HC.minPrice(p).sale, minP = Math.min(...list.map(price)), maxR = Math.max(...list.map(p => p.rating));
    const row = (label, f) => `<tr><th scope="row">${label}</th>${list.map(p => `<td>${f(p)}</td>`).join('')}</tr>`;
    $('#cmpRoot').html(`<div class="table-responsive"><table class="cmp-table" id="cmpTable"><tbody>
      ${row('', p => `<a href="product.html?id=${p.id}"><img src="${p.img}" alt="${p.name}"></a><br><button class="btn btn-sm btn-soft mt-2 cmp-rm" data-id="${p.id}" type="button"><i class="bi bi-x-lg"></i> সরান</button>`)}
      ${row('নাম', p => `<a class="fw-bold" href="product.html?id=${p.id}">${p.name}</a>`)}
      ${row('দাম', p => `<span class="${price(p) === minP && list.length > 1 ? 'cmp-best' : ''}">${p.type === 'variable' || p.type === 'grouped' ? 'থেকে ' : ''}${B(price(p))}</span>${price(p) === minP && list.length > 1 ? ' <small class="cmp-best">সবচেয়ে কম</small>' : ''}`)}
      ${row('রেটিং', p => `${HC.stars(p.rating)} <span class="${p.rating === maxR && list.length > 1 ? 'cmp-best' : ''}">${p.rating}</span> <small class="text-muted">(${p.reviews})</small>`)}
      ${row('ক্যাটাগরি', p => HC.cat(p.cat).name)}
      ${row('ধরন', p => TYPE[p.type])}
      ${row('স্টক', p => p.stock <= 0 ? '<span class="text-danger">স্টক আউট</span>' : p.stock <= HC.LOW_STOCK ? `<span class="text-warning">মাত্র ${p.stock}টি বাকি</span>` : '<span class="cmp-best">স্টকে আছে</span>')}
      ${row('বিক্রি', p => p.sold ? HC.soldFmt(p.sold) + ' পিস' : '—')}
      ${list.some(p => HC.attrs(p)) ? row('অপশন', p => HC.attrs(p) ? p.attributes.map(a => `<div class="small"><b>${a.label}:</b> ${a.values.map(x => typeof x === 'string' ? x : x.v).join(', ')}</div>`).join('') : '—') : ''}
      ${row('ফিচার', p => p.info && p.info.length ? '<ul class="list-unstyled mb-0 small">' + p.info.map(x => `<li><i class="bi ${x[0]} text-brand"></i> ${x[1]}</li>`).join('') + '</ul>' : '—')}
      ${row('', p => p.type === 'external' ? `<a class="btn btn-brand btn-sm rounded-pill" href="${p.url}" target="_blank" rel="sponsored noopener">${p.btn}</a>` : `<button class="btn btn-brand btn-sm rounded-pill cmp-add" data-id="${p.id}" type="button" ${p.stock <= 0 ? 'disabled' : ''}><i class="bi bi-cart-plus"></i> অ্যাড টু কার্ট</button>`)}
    </tbody></table></div>`);
    // শুধু পার্থক্য: সব পণ্যে একই মানের সারি লুকানো যায়
    if (list.length > 1) {
      let same = 0;
      $('#cmpTable tr').each(function () {
        const lab = $(this).find('th').text().trim(); if (!lab || lab === 'নাম' || lab === 'দাম') return;
        const v = $(this).find('td').map((_, e) => $(e).text().replace(/\s+/g, ' ').trim()).get();
        if (v.every(x => x === v[0])) { $(this).addClass('cmp-same'); same++; }
      });
      const on = HC.store.get('hc_cmpdiff', false);
      $('#cmpRoot').prepend(`<div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-2"><label class="form-check form-switch m-0"><input class="form-check-input" type="checkbox" id="cmpDiff" ${on ? 'checked' : ''}><span class="form-check-label">শুধু পার্থক্য দেখান</span></label><small class="text-muted" id="cmpSameNote">${same ? same + 'টি সারিতে সব পণ্যের মান একই' : 'সব সারিতেই পার্থক্য আছে'}</small></div>`);
      $('#cmpTable').toggleClass('diff-only', on);
    }
  }
  $(document).on('change', '#cmpDiff', function () { HC.store.set('hc_cmpdiff', this.checked); $('#cmpTable').toggleClass('diff-only', this.checked); });
  $(document).on('click', '.cmp-rm', function () { HC.store.set('hc_cmp', HC.cmp().filter(x => x !== +$(this).data('id'))); HC.renderCmpBar(); render(); });
  $(document).on('click', '.cmp-add', function () { const p = HC.find($(this).data('id')); HC.add(p.id, HC.lowest(p), 1); HC.toast('কার্টে যোগ হয়েছে ✓'); });
  $(document).on('cmpchange', render);
  render();
});
</script>
</body>
</html>
