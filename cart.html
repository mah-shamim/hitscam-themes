<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>কার্ট – HitsCam</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main class="container">
  <div class="breadcrumb-bar"><a href="index.html">Home</a> / Cart</div>
  <h1 class="page-title mb-3">আপনার কার্ট</h1>

  <div data-cart-page>
    <div id="freeShip"></div>
    <div class="row g-4">
      <div class="col-lg-8">
        <div class="panel mb-3" id="cartList"></div>
        <div id="upsellWrap"><div id="cartAddons"></div></div>
        <div class="section-head mt-4"><h2 class="fs-4">ক্রস সেলস – আপনার পছন্দ হতে পারে</h2></div>
        <div class="row g-3" id="crossSells"></div>
      </div>
      <div class="col-lg-4">
        <div class="panel position-sticky" style="top:110px" id="cartTotals"></div>
      </div>
    </div>
  </div>
</main>
<div id="site-footer"></div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
window.renderCartPage = function () {
  const c = HC.cart();
  $('#freeShip').html(c.length ? HC.freeShipHtml() : '');
  $('#cartList').html(c.length ? '<h5 class="fw-bold mb-1">কার্ট লিস্ট</h5>' + c.map(HC.line).join('') : HC.emptyCart);
  $('#cartAddons').html(c.length ? HC.addonsHtml() : '');
  const inCart = new Set(c.map(i => i.id));
  $('#crossSells').html(HC.D.products.filter(p => !inCart.has(p.id) && p.type !== 'external').slice(0, 4).map(p => `<div class="col-12 col-sm-6 col-md-3">${HC.card(p)}</div>`).join(''));
  $('#cartTotals').html(`<h5 class="fw-bold mb-3">Cart totals</h5>${HC.couponHtml()}${HC.totalsHtml()}
    ${c.length ? `<a href="checkout.html" class="btn btn-brand btn-lg w-100 mt-3">প্রসেস টু চেকআউট <i class="bi bi-arrow-right"></i></a>` : ''}
    <a href="shop.html" class="btn btn-soft w-100 mt-2">কেনাকাটা চালিয়ে যান</a>`);
};
$(function () { window.renderCartPage(); });
</script>
</body>
</html>
