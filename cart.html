<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f172a'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23e03131'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23fff'/%3E%3C/svg%3E">
<title>কার্ট – HitsCam</title>
<meta name="description" content="আপনার কার্ট – HitsCam">
<meta name="theme-color" content="#e03131"><meta name="robots" content="noindex,follow">
<meta property="og:site_name" content="HitsCam"><meta property="og:locale" content="bn_BD"><meta property="og:type" content="website">
<meta property="og:title" content="কার্ট – HitsCam"><meta property="og:description" content="আপনার কার্ট – HitsCam"><meta property="og:image" content="assets/icons/icon-512.png">
<meta name="twitter:card" content="summary"><meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main class="container">
  <div class="breadcrumb-bar"><a href="index.html">Home</a> / Cart</div>
  <h1 class="page-title mb-3">আপনার কার্ট</h1>

  <div data-cart-page>
    <div id="freeShip"></div>
    <div class="row g-4">
      <div class="col-lg-8">
        <div class="panel mb-3" id="cartList"></div>
        <div id="upsellWrap"><div id="cartAddons"></div></div>
        <div class="section-head mt-4"><h2 class="fs-4">ক্রস সেলস – আপনার পছন্দ হতে পারে</h2>
          <button type="button" class="btn btn-soft btn-sm rounded-pill d-md-none" id="csToggle" aria-expanded="false" aria-controls="crossSells"><span class="cs-label">দেখুন</span> <i class="bi bi-chevron-down"></i></button></div>
        <div class="row g-3 cs-closed" id="crossSells"></div>
      </div>
      <div class="col-lg-4">
        <div class="cart-side">
          <div class="panel" id="cartTotals"></div>
          <div class="panel cart-trust mt-3" id="cartTrust"></div>
        </div>
      </div>
    </div>
  </div>
</main>
<div id="site-footer"></div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/extras.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/analytics.js"></script>
<script>
window.renderCartPage = function () {
  const c = HC.cart();
  $('#freeShip').html(c.length ? HC.freeShipHtml() : '');
  $('#cartList').html(c.length ? '<h5 class="fw-bold mb-1">কার্ট লিস্ট</h5>' + c.map(HC.line).join('') : HC.emptyCart);
  $('#cartAddons').html(c.length ? HC.addonsHtml() : '');
  const inCart = new Set(c.map(i => i.id));
  $('#crossSells').html(HC.D.products.filter(p => !inCart.has(p.id) && p.type !== 'external').slice(0, 4).map(p => `<div class="col-12 col-sm-6">${HC.card(p)}</div>`).join(''));
  $('#cartTotals').html(`<h5 class="fw-bold mb-3">Cart totals</h5>${HC.couponHtml()}${HC.totalsHtml()}
    ${c.length ? `<a href="checkout.html" class="btn btn-brand btn-lg w-100 mt-3">প্রসেস টু চেকআউট <i class="bi bi-arrow-right"></i></a>${HC.waBtn.replace('w-100','w-100 mt-2')}` : ''}
    <a href="shop.html" class="btn btn-soft w-100 mt-2">কেনাকাটা চালিয়ে যান</a>`);
  // ডেলিভারি ও আস্থা বক্স (টোটালের নিচে): এলাকা বাছলে শিপিং চার্জ ও টোটাল বদলায়
  const z = HC.ship() == 130 ? 130 : 70, t = HC.totals();
  $('#cartTrust').toggle(c.length > 0).html(c.length ? `
    <div class="fw-semibold mb-1"><i class="bi bi-truck text-brand"></i> আনুমানিক ডেলিভারি</div>
    <div class="zones" role="group" aria-label="ডেলিভারি এলাকা">
      <button type="button" class="zone-btn ${z === 70 ? 'active' : ''}" data-z="70" aria-pressed="${z === 70}">ঢাকার ভিতরে</button>
      <button type="button" class="zone-btn ${z === 130 ? 'active' : ''}" data-z="130" aria-pressed="${z === 130}">ঢাকার বাইরে</button></div>
    <div class="small text-muted" id="cartDeliv">${HC.deliveryText(z, t.sub)}</div>
    <hr class="my-3">
    <ul class="trust-list">
      <li><i class="bi bi-arrow-repeat"></i> ৭ দিনের সহজ রিটার্ন</li>
      <li><i class="bi bi-patch-check"></i> অরিজিনাল পণ্য, ওয়ারেন্টিসহ</li>
      <li><i class="bi bi-shield-lock"></i> নিরাপদ পেমেন্ট ও তথ্য সুরক্ষা</li></ul>
    <div class="pay-chips" aria-label="পেমেন্ট মাধ্যম"><span><i class="bi bi-cash-coin"></i> ক্যাশ অন ডেলিভারি</span><span>বিকাশ</span><span>নগদ</span></div>
    <hr class="my-3">
    <div class="small">সাহায্য লাগবে? <a class="text-brand fw-semibold" href="tel:+8801614747054"><i class="bi bi-telephone"></i> +880 1614-747054</a></div>` : '');
};
$(function () {
  $(document).on('click', '#cartTrust .zone-btn', function () { HC.store.set('hc_ship', +$(this).data('z')); $(document).trigger('cartchange'); });
  window.renderCartPage();
  // মোবাইলে ক্রস-সেলস ডিফল্টে বন্ধ; কাস্টমার চাইলে খুলে দেখতে পারে (ডেস্কটপে সবসময় খোলা)
  $('#csToggle').on('click', function () {
    const open = $('#crossSells').hasClass('cs-closed');
    $('#crossSells').toggleClass('cs-closed', !open);
    $(this).attr('aria-expanded', open).toggleClass('open', open).find('.cs-label').text(open ? 'লুকান' : 'দেখুন');
  });
});
</script>
</body>
</html>
