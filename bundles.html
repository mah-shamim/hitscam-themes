<body>
<div id="site-header"></div>
<main class="container">
  <div class="breadcrumb-bar"><a href="index.html">Home</a> / বান্ডেল অফার</div>
  <h1 class="page-title mb-3">বান্ডেল অফার</h1>
  <p class="text-muted">একসাথে কিনলে আলাদা ছাড় — প্রতিটি আইটেমে বান্ডেল ডিসকাউন্ট বসে যায়।</p>
  <div class="row g-3" id="bndList"></div>
</main>
<div id="site-footer"></div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
$(function () {
  const B = HC.BDT;
  $('#bndList').html(HC.D.bundles.map(b => {
    const its = HC.bundleItems(b), reg = its.reduce((s, x) => s + x.o.sale, 0), tot = its.reduce((s, x) => s + x.sale, 0);
    return `<div class="col-12 col-md-6 col-lg-4"><div class="bnd-card"><div class="d-flex justify-content-between align-items-start"><h2 class="h5 fw-bold m-0">${b.name}</h2><span class="bnd-save">−${b.off}%</span></div>
      <p class="text-muted small mt-1 mb-0">${b.desc}</p>
      <div class="bnd-items">${its.map(x => `<a class="bnd-item text-decoration-none text-reset" href="product.html?id=${x.p.id}"><img src="${x.p.img}" alt=""><span class="nm">${x.p.name}${x.o.label ? ' <small class="text-muted">(' + x.o.label + ')</small>' : ''}</span><span class="text-end"><del>${B(x.o.sale)}</del><br><b>${B(x.sale)}</b></span></a>`).join('')}</div>
      <div class="mt-auto"><div class="d-flex justify-content-between align-items-end mb-2"><span class="text-muted small">বান্ডেল দাম<br><del>${B(reg)}</del></span><span class="text-brand fw-bold fs-4">${B(tot)}</span></div>
      <div class="bnd-save mb-2">আপনি বাঁচাচ্ছেন ${B(reg - tot)}</div>
      <button type="button" class="btn btn-brand w-100 rounded-pill bnd-add" data-id="${b.id}"><i class="bi bi-bag-plus"></i> বান্ডেল কার্টে যোগ করুন</button></div></div></div>`;
  }).join(''));
  $(document).on('click', '.bnd-add', function () { HC.addBundle($(this).data('id')); HC.toast('বান্ডেল কার্টে যোগ হয়েছে ✓'); });
});
</script>
</body>
</html>
