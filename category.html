<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f172a'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23e03131'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23fff'/%3E%3C/svg%3E">
<title>ক্যাটাগরি – HitsCam</title>
<meta name="description" content="ক্যাটাগরি অনুযায়ী ক্যামেরা ও গ্যাজেট দেখুন – HitsCam এ সেরা দামে অরিজিনাল পণ্য।">
<meta name="theme-color" content="#e03131">
<meta property="og:site_name" content="HitsCam"><meta property="og:locale" content="bn_BD"><meta property="og:type" content="website">
<meta property="og:title" content="ক্যাটাগরি – HitsCam"><meta property="og:description" content="ক্যাটাগরি অনুযায়ী ক্যামেরা ও গ্যাজেট দেখুন – HitsCam এ সেরা দামে অরিজিনাল পণ্য।"><meta property="og:image" content="assets/icons/icon-512.png">
<meta name="twitter:card" content="summary"><meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main class="container">
  <div class="breadcrumb-bar"><a href="index.html">Home</a> / <a href="shop.html">Shop</a> / <span id="bcCat"></span></div>

  <div class="page-banner mb-4"><h1 class="page-title mb-1" id="catTitle"></h1><p class="mb-0 opacity-75" id="catCount"></p></div>

  <!-- টপ সেলিং ২ প্রোডাক্ট -->
  <div class="section-head"><h2 class="fs-4">এই ক্যাটাগরির টপ সেলিং</h2></div>
  <div class="row g-3 mb-4 m-slider s-md" id="topSell"></div>

  <div class="row g-4">
    <aside class="col-lg-3">
      <button class="btn btn-soft w-100 d-lg-none mb-2" data-bs-toggle="collapse" data-bs-target="#filters"><i class="bi bi-funnel"></i> ফিল্টার</button>
      <div id="filters" class="collapse d-lg-block"></div>
    </aside>
    <section class="col-lg-9">
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <span class="text-muted" id="resultCount"></span>
        <select id="sortBy" class="form-select form-select-sm w-auto"><option value="pop">জনপ্রিয়তা</option><option value="low">দাম: কম থেকে বেশি</option><option value="high">দাম: বেশি থেকে কম</option><option value="rating">রেটিং</option></select>
      </div>
      <div class="row g-3" id="productList"></div>
    </section>
  </div>
</main>
<div id="site-footer"></div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/shop.js"></script>
<script>
$(function () {
  const slug = new URLSearchParams(location.search).get('cat') || HC.D.categories[0].slug;
  const cat = HC.cat(slug), list = HC.D.products.filter(p => p.cat === slug);
  document.title = cat.name + ' – HitsCam';
  $('#bcCat, #catTitle').text(cat.name); $('#catCount').text(list.length + 'টি পণ্য');
  const top = list.slice().sort((a, b) => b.reviews - a.reviews).slice(0, 2);
  $('#topSell').html(top.map(p => `<div class="col-md-6"><div class="top-sell"><img src="${p.img}" alt=""><div><span class="badge bg-danger mb-1">Top Selling</span>
    <a class="d-block fw-semibold" href="product.html?id=${p.id}">${p.name}</a><div class="small">${HC.stars(p.rating)} (${p.reviews})</div>
    <div class="fw-bold text-brand">${HC.BDT(HC.minPrice(p).sale)}</div></div></div></div>`).join('') || '<div class="col-12 text-muted">এই ক্যাটাগরিতে এখনো পণ্য নেই।</div>');
  initShopFilters({ fixedCat: slug });
});
</script>
</body>
</html>
